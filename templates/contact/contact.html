{% extends 'base/base.html' %}
{% block meta %}
<meta name="title" content="Contact Us - Output DGO">
<meta name="description" content="Get in touch with Output DGO for inquiries, consultations, or quotes. We are here to help you with your design and development needs.">
<meta name="keywords" content="Output DGO, contact, inquiries, consultations, quotes, design, development">
<meta name="author" content="Output DGO">
<title>CONTACT - OUTPUT DGO</title>
{% endblock %}
{% block content %}
<section class="contact container">
    <h2 class="special">Get in touch!</h2>
    <p>Have a question? Contact us today to schedule a consultation or request a quote.</p>
    <form class="container" action="" method="post">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>
        
        <!-- Honeypot field - hidden from users, visible to bots -->
        <input type="text" name="website" id="website" style="display: none;" tabindex="-1" autocomplete="off">
        
        <!-- Time-based protection - hidden timestamp -->
        <input type="hidden" name="form_timestamp" id="form_timestamp" value="">
        
        <button type="submit">Submit</button>
    </form>
    
    <script>
    // Set timestamp when page loads (anti-bot time check)
    document.getElementById('form_timestamp').value = Date.now();
    
    // Additional bot detection - disable form for first 3 seconds
    const submitBtn = document.querySelector('button[type="submit"]');
    const form = document.querySelector('form');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Loading...';
    
    setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
    }, 3000);
    
    // Prevent rapid form submissions
    form.addEventListener('submit', function(e) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
    });
    </script>
</section>
{% endblock %}
