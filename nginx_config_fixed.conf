# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

# Bad bot blocking
map $http_user_agent $bad_bot {
    default 0;
    ~*crawl 1;
    ~*slurp 1;
    ~*spider 1;
    ~*bot 1;
}

server {
    listen 80;
    server_name outputdgo.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name outputdgo.com;

    # SSL Configuration - Let's Encrypt handles protocols and ciphers
    ssl_certificate /etc/letsencrypt/live/outputdgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outputdgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Additional SSL Security (not conflicting with Let's Encrypt)
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.ckeditor.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.ckeditor.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Hide Nginx version
    server_tokens off;

    # Block bad bots
    if ($bad_bot) {
        return 444;
    }

    # Rate limiting
    location /admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://unix:/home/ubuntu/basedgo1/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(login|auth)/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://unix:/home/ubuntu/basedgo1/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ubuntu/basedgo1/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        
        # Additional security for static files
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            return 444;
        }
    }

    location /media/ {
        alias /home/ubuntu/basedgo1/media/;
        expires 1M;
        add_header Cache-Control "public";
        
        # Additional security for media files
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            return 444;
        }
    }

    # Block access to sensitive files
    location ~ /\.(ht|git|env) {
        deny all;
        return 444;
    }

    location ~ \.(sql|sqlite|db|log)$ {
        deny all;
        return 444;
    }

    # Block common attack patterns
    location ~ /(wp-admin|wp-login|phpmyadmin|admin\.php|config\.php) {
        return 444;
    }

    location / {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://unix:/home/ubuntu/basedgo1/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
